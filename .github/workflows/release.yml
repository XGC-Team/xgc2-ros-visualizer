name: release
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected product version
        required: true
        type: string
      expected_source_sha:
        description: Expected exact source commit
        required: true
        type: string
      prepare_action:
        description: Central release-train action
        required: false
        default: release
        type: choice
        options: [release, compatibility-verify]
      apt_overlay_url:
        description: Central release-scoped staging APT base URL
        required: false
        default: ""
        type: string
      dependency_set_digest:
        description: SHA256 of central resolved dependency set
        required: false
        default: ""
        type: string
permissions:
  contents: read
  actions: read
env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
jobs:
  prepare-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate central prepare contract
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PREPARE_ACTION: ${{ inputs.prepare_action }}
          APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
          DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
        run: |
          set -euo pipefail
          test "$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)" = "$EXPECTED_VERSION"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          case "$PREPARE_ACTION" in release|compatibility-verify) ;; *) exit 1 ;; esac
          [[ -z "$DEPENDENCY_SET_DIGEST" || "$DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ -z "$APT_OVERLAY_URL" || "$DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          # The build installs robot description assets and XRPC in its private container.
  build:
    needs: prepare-contract
    name: package-tests-debs-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64-focal
            arch: amd64
            distribution: focal
            runner: ubuntu-24.04
          - name: arm64-focal
            arch: arm64
            distribution: focal
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact worker source
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          test "$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)" = "$EXPECTED_VERSION"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Cache verified Focal Zenoh C SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ros-visualizer-${{ matrix.name }}/zenoh-sdk
          key: visualizer-zenoh-c-1.8.0-focal-fce2d76fddf4-${{ matrix.arch }}-${{ hashFiles('.xgc2/zenoh-c-1.8.0/*', '.xgc2/scripts/build_zenoh_sdk.sh') }}
      - name: Build, test and install-check Deb in controlled Noetic image
        env:
          BUILD_IMAGE: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.8@sha256:fce2d76fddf4f6439bf0a188249b731650febdc163befc360bed186b269d252a
        run: |
          set -euo pipefail
          install -d .ci/build-manifests
          .xgc2/scripts/build_debs_in_docker.sh \
            --image "$BUILD_IMAGE" \
            --work-dir "$RUNNER_TEMP/ros-visualizer-${{ matrix.name }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"
      - name: Create strict-v1 trusted build manifest
        run: |
          set -euo pipefail
          product_version="$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          test -n "$product_version"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs --output-dir .ci/build-manifests \
            --product xgc2-ros-visualizer --product-version "$product_version" \
            --distribution "${{ matrix.distribution }}" --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - name: Upload Deb and manifest
        if: ${{ inputs.prepare_action == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-ros-visualizer-debs-${{ matrix.name }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
