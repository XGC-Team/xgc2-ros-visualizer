schema: xgc2.product.v1
id: xgc2-ros-visualizer
name: XGC2 ROS Visualizer
version: 0.6.0-1
kind: ros1-apt
summary: Single-process ROS visualization server with Run-owned instances, per-robot profiles and kind/channel publication rates with per-robot overrides.
ros:
  distro: noetic
  packages:
  - xgc2_ros_visualizer
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-ros-visualizer
  packages:
  - ros-noetic-xgc2-ros-visualizer
  package_distributions:
    ros-noetic-xgc2-ros-visualizer:
    - focal
  depends:
  - libxgc2-xrpc2 (>= 0.2.0-1~focal)
  - ros-noetic-xgc2-fs150-description
  - ros-noetic-xgc2-scout-description
  - ros-noetic-xgc2-mecanum-description
usage:
  install: sudo apt install ros-noetic-xgc2-ros-visualizer
  smoke_test: rospack find xgc2_ros_visualizer
ownership:
  paths:
  - /opt/ros/noetic/share/xgc2_ros_visualizer
  - /opt/ros/noetic/include/xgc2_ros_visualizer
  - /opt/ros/noetic/lib/pkgconfig/xgc2_ros_visualizer.pc
  - /opt/ros/noetic/lib/xgc2_ros_visualizer
  - /opt/ros/noetic/lib/libxgc2_ros_visualizer_runtime.so
  - /opt/ros/noetic/lib/libxgc2_ros_visualizer_contract.so
  - /usr/share/xgc2/process-definitions/xgc2-ros-visualizer.json
release:
  repository: XGC-Team/xgc2-ros-visualizer
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  requires:
  - xgc2-xrpc
  dependency_policy:
    xgc2-xrpc: rebuild
    xgc2-fs150-description: verify
    xgc2-scout-description: verify
    xgc2-mecanum-description: verify
  apt_versions:
    focal: 0.6.0-1~focal
